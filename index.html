<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BUGS — Back Up Gate Solution. Portable 12V DC backup battery that keeps your electric gate and garage door working through load shedding and power outages." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>BUGS | Back Up Gate Solution — BUGZ</title>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Static shadow form so Netlify's build-time form parser can detect and
      register the "contact" form. This markup is never rendered/shown to
      users — the real, visible form lives in src/components/CTAContact.tsx
      and submits to this same form name via a manual fetch() POST. Field
      `name` attributes here must match the real form's field names exactly.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="text" name="phone" />
      <input type="text" name="property-type" />
      <input type="text" name="motor-voltage" />
      <input type="text" name="motor-brand" />
      <input type="text" name="complex-units" />
      <input type="text" name="access-type" />
      <input type="text" name="building-type" />
      <input type="text" name="business-type" />
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
